services:
  - type: web
    name: presethub
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://presethub.site
      - key: ADSENSE_CLIENT
        value: ca-pub-3554311294133493
      - key: NODE_VERSION
        value: 20.11.0
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: AUTO_APPROVE_UPLOADS
        value: 'true'
      - key: VAPID_SUBJECT
        value: mailto:admin@presethub.site
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: API_BASE
        value: https://presethub.site/api