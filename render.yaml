services:
  - type: web
    name: presethub
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://presethub.site
      - key: ADSENSE_CLIENT
        value: ca-pub-3554311294133493
      - key: NODE_VERSION
        value: 20.11.0
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: PAYMENT_PROVIDER
        value: cashfree
      - key: PAYOUT_ENC_KEY
        sync: false
      - key: CREATOR_SHARE
        value: "0.8"
      - key: PAYOUT_MIN_RUPEES
        value: "100"
      - key: CASHFREE_ENV
        value: sandbox
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_API_VERSION
        value: 2025-01-01
      - key: YOUPI_API_URL
        sync: false
      - key: YOUPI_MERCHANT_ID
        sync: false
      - key: YOUPI_API_KEY
        sync: false
      - key: YOUPI_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@presethub.site
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: API_BASE
        value: https://presethub.site/api