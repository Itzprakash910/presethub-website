<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Admin Dashboard – PresetHub</title>
  <link rel="icon" href="/assets/icons/favicon-32x32.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<main id="main" class="admin-container">
  <header class="admin-header"><div><div class="admin-kicker">PresetHub</div><h1><i class="fas fa-shield-halved"></i> Admin Dashboard</h1><p>Platform moderation, analytics and user overview</p></div><div class="admin-actions"><a class="btn btn-outline" href="/"><i class="fas fa-arrow-left"></i> Website</a><button class="btn btn-outline" id="refreshBtn"><i class="fas fa-rotate"></i> Refresh</button><button class="btn btn-primary" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> Logout</button></div></header>
  <div id="message" role="status" aria-live="polite"></div>
  <section class="admin-card"><div class="card-heading"><h2><i class="fas fa-chart-line"></i> Platform Analytics</h2></div><div class="stats-grid" id="analytics"><div class="skeleton" style="height:80px"></div></div></section>
  <section class="admin-card"><div class="card-heading"><h2><i class="fas fa-cubes"></i> Presets</h2><span class="muted">Pending items appear first</span></div><div id="presetsList"><div class="skeleton" style="height:120px"></div></div></section>
  <section class="admin-card"><div class="card-heading"><h2><i class="fas fa-users"></i> Users</h2></div><div class="table-wrap" id="usersList"><div class="skeleton" style="height:120px"></div></div></section>
</main>
<script src="/admin.js"></script>
</body>
</html>
